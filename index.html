<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead Hang Challenge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 35px 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .prize {
      background: #171717;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .prize-title {
      color: #aaa;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .prize-money {
      font-size: 42px;
      font-weight: bold;
      margin-top: 8px;
    }

    .record {
      background: white;
      color: black;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .record-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .record-time {
      font-size: 48px;
      font-weight: bold;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .leaderboard {
      margin-top: 35px;
      text-align: left;
    }

    .leaderboard h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    .player {
      display: flex;
      justify-content: space-between;
      padding: 16px;
      margin-bottom: 8px;
      background: #171717;
      border-radius: 12px;
    }

    .rank {
      color: #aaa;
      margin-right: 10px;
    }

    .time {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">DEAD HANG</div>

    <h1>BEAT TODAY'S<br>HIGH SCORE</h1>

    <div class="subtitle">
      How long can you hang?
    </div>

    <div class="prize">
      <div class="prize-title">Today's Prize</div>
      <div class="prize-money">€100</div>
    </div>

    <div class="record">
      <div class="record-title">Current High Score</div>
      <div class="record-time">1:47</div>
    </div>

    <button onclick="joinChallenge()">
      JOIN TODAY'S CHALLENGE
    </button>

    <div class="leaderboard">

      <h2>Today's Leaderboard</h2>

      <div class="player">
        <div>
          <span class="rank">🥇</span>
          Daniel
        </div>
        <div class="time">1:47</div>
      </div>

      <div class="player">
        <div>
          <span class="rank">🥈</span>
          Marcus
        </div>
        <div class="time">1:39</div>
      </div>

      <div class="player">
        <div>
          <span class="rank">🥉</span>
          Jason
        </div>
        <div class="time">1:32</div>
      </div>

    </div>

  </div>

  <script>
    function joinChallenge() {
      alert("Challenge registration coming next!");
    }
  </script>

</body>
</html>
