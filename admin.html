<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dead Hang Staff</title>

<style>
body{
  font-family:Arial;
  background:#050505;
  color:#fff;
  max-width:650px;
  margin:auto;
  padding:25px
}

input,button{
  padding:12px;
  border-radius:8px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  width:100%;
  margin:6px 0
}

button{
  background:#fff;
  color:#000;
  font-weight:800;
  cursor:pointer
}

.player{
  padding:12px;
  border:1px solid #222;
  margin:8px 0;
  border-radius:10px
}

.error{
  color:#ff6b6b;
  margin-top:15px
}
</style>
</head>

<body>

<h1>THE DEAD HANG — STAFF</h1>

<p>
Use this page to record an official verified time.
Keep this page private.
</p>

<label>Admin secret</label>

<input
  id="secret"
  type="password"
  placeholder="Enter admin secret"
>

<button id="load">
  LOAD UNVERIFIED PLAYERS
</button>

<div id="list"></div>

<script>

const FUNCTION_URL =
  "https://krxigmwxntdwqikumabn.supabase.co/functions/v1/record-score";

const SUPABASE_KEY =
  "sb_publishable_rAj3Me-MtVgT7MPT7itNzw_2l1jwcaY";

const $ = x =>
  document.querySelector(x);


async function load(){

  const secret =
    $("#secret").value.trim();

  if(!secret){
    alert("Enter the admin secret first.");
    return;
  }

  $("#list").innerHTML =
    "<p>Loading...</p>";

  const response =
    await fetch(
      FUNCTION_URL,
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "x-admin-secret":secret
        }
      }
    );

  const result =
    await response.json();

  if(!response.ok){

    $("#list").innerHTML =
      `<p class="error">
        ${esc(result.error || "Failed to load players")}
      </p>`;

    return;
  }

  const data =
    result.players || [];

  $("#list").innerHTML =
    data.map(p => `

      <div class="player">

        <b>${esc(p.name)}</b>

        <br>

        <small>
          ${esc(p.contact_method || "")}
          ·
          ${esc(p.contact_details || "")}
        </small>

        <input
          id="t-${p.id}"
          type="number"
          min="1"
          placeholder="Official time in seconds"
        >

        <button
          onclick="score('${p.id}')"
        >
          SAVE OFFICIAL TIME
        </button>

      </div>

    `).join("")

    ||

    "<p>No unverified players.</p>";
}


window.score =
async function(id){

  const secret =
    $("#secret").value.trim();

  const seconds =
    Number(
      document.querySelector(
        "#t-" + id
      ).value
    );

  if(!secret){
    alert("Enter the admin secret.");
    return;
  }

  if(
    !Number.isInteger(seconds) ||
    seconds <= 0
  ){
    alert("Enter time in seconds.");
    return;
  }

  const response =
    await fetch(
      FUNCTION_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY,

          "x-admin-secret":
            secret
        },

        body:JSON.stringify({
          player_id:id,
          official_time_seconds:
            seconds
        })
      }
    );

  const result =
    await response.json();

  if(!response.ok){

    alert(
      result.error ||
      "Failed to save score."
    );

    return;
  }

  alert(
    `Saved! New rank: #${result.newRank}`
  );

  load();
};


function esc(value){

  return String(value || "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );
}


$("#load").onclick =
  load;

</script>

</body>
</html>
